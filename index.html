<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alma en Foco | Sinapsis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --azul-suave: #a0d8ef; }
        body { background-color: #0d1117; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .navbar { border-bottom: 2px solid var(--azul-suave); }
        .btn-azul { background-color: var(--azul-suave); color: #000; border: none; }
        #contenedor-asistente { display: none; position: fixed; top: 20%; left: 10%; width: 80%; z-index: 9999; }
        .card-sistema { background: #161b22; border: 1px solid var(--azul-suave); padding: 2rem; border-radius: 15px; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">ALMA EN FOCO</a>
            <div id="usuario-display"></div>
        </div>
    </nav>

    <!-- HERO -->
    <header class="container text-center py-5">
        <h1 class="display-3">Sinapsis</h1>
        <p class="lead text-muted">Tu ecosistema de juegos y coaching.</p>
        <button class="btn btn-azul btn-lg mt-3" onclick="Sinapsis.iniciarMesa('Alma en Foco')">Entrar al Sistema</button>
    </header>

    <!-- INTERFAZ DEL SISTEMA (Oculta por defecto) -->
    <div id="contenedor-asistente" class="container">
        <div class="card-sistema shadow-lg text-center">
            <h2 id="titulo-mesa">Cargando...</h2>
            <div id="contenido-mesa" class="my-4">
                <p>Bienvenida a tu espacio de trabajo.</p>
            </div>
            <button class="btn btn-outline-light" onclick="location.reload()">Cerrar Mesa</button>
        </div>
    </div>

    <!-- MODAL AUTH -->
    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark border border-info">
                <div class="modal-body">
                    <h5 class="mb-3">Identificación</h5>
                    <input type="email" id="userEmail" class="form-control mb-3" placeholder="Tu email...">
                    <button class="btn btn-azul w-100" onclick="Sinapsis.procesarLogin()">Ingresar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS INTEGRADOS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const Sinapsis = {
            init: function() {
                const user = localStorage.getItem('usuario');
                if(user) document.getElementById('usuario-display').innerText = "Hola, " + user;
            },
            procesarLogin: function() {
                const email = document.getElementById('userEmail').value;
                if(email) {
                    localStorage.setItem('usuario', email.split('@')[0]);
                    location.reload();
                }
            },
            iniciarMesa: function(nombre) {
                if(!localStorage.getItem('usuario')) {
                    new bootstrap.Modal(document.getElementById('authModal')).show();
                } else {
                    document.getElementById('titulo-mesa').innerText = "Mesa: " + nombre;
                    document.getElementById('contenedor-asistente').style.display = 'block';
                }
            }
        };
        Sinapsis.init();
    </script>
</body>
</html>
