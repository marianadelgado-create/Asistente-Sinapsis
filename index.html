<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinapsis | Alma en Foco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .navbar { border-bottom: 1px solid #00f2fe; }
        .card-custom { background: #1a1a1a; border: 1px solid #333; transition: 0.3s; }
        .card-custom:hover { border-color: #00f2fe; }
        #contenedor-asistente { display: none; position: fixed; top: 15%; left: 10%; width: 80%; background: #000; border: 2px solid #00f2fe; z-index: 9999; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">SINAPSIS</a>
            <button class="btn btn-outline-info" id="btn-login" onclick="Sinapsis.iniciarMesa('Acceso')">Iniciar Sesión</button>
        </div>
    </nav>

    <header class="container text-center py-5">
        <h1>Proyecto Alma en Foco</h1>
        <p>Tu sistema de experiencias fígitales.</p>
    </header>

    <section class="container py-4">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card card-custom p-3">
                    <h3>Alma en Foco</h3>
                    <button class="btn btn-info mt-3" onclick="Sinapsis.iniciarMesa('Alma en Foco')">Abrir Mesa</button>
                </div>
            </div>
        </div>
    </section>

    <div id="contenedor-asistente">
        <h2 id="titulo-mesa">Mesa</h2>
        <div id="contenido-mesa"></div>
        <button class="btn btn-danger mt-3" onclick="location.reload()">Cerrar Mesa</button>
    </div>

    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white">
                <div class="modal-body">
                    <input type="email" id="userEmail" class="form-control" placeholder="mariana@isec.edu.ar">
                    <button class="btn btn-info w-100 mt-2" onclick="Sinapsis.procesarLogin()">Entrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const Sinapsis = {
            procesarLogin: function() {
                const email = document.getElementById('userEmail').value;
                if(email) {
                    localStorage.setItem('usuario', email);
                    location.reload();
                }
            },
            iniciarMesa: function(nombre) {
                const user = localStorage.getItem('usuario');
                if(!user) {
                    new bootstrap.Modal(document.getElementById('authModal')).show();
                } else {
                    document.getElementById('titulo-mesa').innerText = nombre;
                    document.getElementById('contenedor-asistente').style.display = 'block';
                }
            }
        };
    </script>
</body>
</html>
