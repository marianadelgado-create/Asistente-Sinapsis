<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SINAPSIS | Ecosistema Oficial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --cyan: #00f2fe; --dark: #050505; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; }
        
        .navbar { border-bottom: 1px solid #333; background: #000; padding: 1.5rem 3rem; }
        .brand-text { font-size: 1.5rem; letter-spacing: 2px; }
        
        /* Dashboard Mejorado */
        .game-card { 
            background: #0f0f0f; 
            border: 1px solid #222; 
            border-radius: 20px; 
            padding: 40px; 
            transition: 0.3s;
            height: 100%;
        }
        .game-card:hover { border-color: var(--cyan); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .game-title { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .game-subtitle { color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; margin-bottom: 2rem; }
        
        .btn-main { background: var(--cyan); color: #000; border-radius: 50px; padding: 12px 30px; font-weight: 800; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="brand-text fw-bold">SINAPSIS <span class="text-muted">| Alma en Foco</span></div>
        <div class="text-cyan fw-bold fs-5">Mariana Delgado</div>
    </nav>

    <main class="container-fluid px-5 py-5">
        <h1 class="mb-5 display-4 fw-bold">Ecosistema de Juegos</h1>
        <div class="row g-4" id="gallery"></div>
    </main>

    <script>
        const games = [
            { name: "Ajedrez", type: "Clásico" },
            { name: "Truco", type: "Clásico" },
            { name: "Lab. Híbrido", type: "Fase 4 (IoT)" }
        ];

        const container = document.getElementById('gallery');
        games.forEach(g => {
            container.innerHTML += `
                <div class="col-md-4">
                    <div class="game-card text-center">
                        <div class="game-title">${g.name}</div>
                        <div class="game-subtitle">${g.type}</div>
                        <button class="btn btn-main w-100">Ingresar</button>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
