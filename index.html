<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinapsis - Universo Fígital V2</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- TU CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="space-bg"></div>
<div class="glow-blue"></div>
<div class="glow-coral"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">

        <a href="#" class="navbar-brand d-flex align-items-center gap-2">
            <img src="img/logo sinapsis.png" style="height:55px;">
            <span class="fw-bold">SINAPSIS</span>
        </a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto gap-2">
                <li class="nav-item"><a class="nav-link" href="#comunidad">Comunidad</a></li>
                <li class="nav-item"><a class="nav-link" href="#galeria">Mesa</a></li>
                <li class="nav-item"><a class="nav-link" href="#dashboard-seccion">Libreta</a></li>
            </ul>

            <!-- PERFIL -->
            <div class="ms-lg-3 dropdown">
                <button class="btn-profile-pill dropdown-toggle" data-bs-toggle="dropdown">
                    <div class="avatar-dot" id="avatar-icon">?</div>
                    <span id="texto-login">Mi Perfil</span>
                </button>

                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><h6 class="dropdown-header" id="header-usuario">Invitado</h6></li>
                    <li><a class="dropdown-item" onclick="abrirLibreta()">Libreta</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" onclick="gestionarSesion()">Salir</a></li>
                </ul>
            </div>

        </div>
    </div>
</nav>

<!-- HERO -->
<header id="comunidad" class="container py-5 text-center">
    <h1 class="text-white">Sinapsis V2</h1>
    <p class="text-muted">Sistema de juegos híbridos + libreta digital</p>
    <a href="#galeria" class="btn btn-cyan-premium">Entrar</a>
</header>

<!-- MESA DE JUEGO -->
<section id="galeria" class="container py-5">

    <h2 class="text-white mb-4">Mesa de Juegos</h2>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="game-card-premium p-3">
                <h4>Rummy</h4>
                <button class="btn btn-sm btn-cyan-premium" onclick="iniciarMesa('Rummy')">Jugar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="game-card-premium p-3">
                <h4>Truco</h4>
                <button class="btn btn-sm btn-cyan-premium" onclick="iniciarMesa('Truco')">Jugar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="game-card-premium p-3">
                <h4>Ajedrez</h4>
                <button class="btn btn-sm btn-cyan-premium" onclick="iniciarMesa('Ajedrez')">Jugar</button>
            </div>
        </div>

    </div>
</section>

<!-- LIBRETA -->
<section id="dashboard-seccion" class="container py-5 d-none">

    <div class="dashboard-card p-4">
        <h2 class="text-white">Libreta Virtual</h2>

        <p class="text-muted">Usuario activo: <span id="user-label"></span></p>

        <div class="mt-3">
            <button class="btn btn-outline-success" onclick="sumar()">+</button>
            <span id="display-puntos" class="mx-3 text-white fs-3">0</span>
            <button class="btn btn-outline-danger" onclick="restar()">-</button>
        </div>
    </div>

</section>

<!-- MESA ACTIVA -->
<div id="contenedor-asistente" class="container my-4 d-none">
    <div class="dashboard-card p-4 text-white">
        <h3 id="mesa-juego"></h3>

        <div class="d-flex gap-3 align-items-center">
            <button onclick="cambiarPuntos(-1)" class="btn btn-danger">-</button>
            <span id="display-puntos" class="fs-3">0</span>
            <button onclick="cambiarPuntos(1)" class="btn btn-success">+</button>
        </div>

        <button class="btn btn-light mt-3" onclick="cerrarMesa()">Cerrar</button>
    </div>
</div>

<!-- MODAL LOGIN -->
<div class="modal fade" id="modalBienvenida">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3">
            <h5>Bienvenido</h5>
            <input id="inputNombre" class="form-control mt-2" placeholder="Tu nombre">
            <button class="btn btn-cyan-premium mt-3" onclick="guardarNombre()">Entrar</button>
        </div>
    </div>
</div>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS FIXED -->
<script>
let usuario = null;
let puntos = 0;

window.addEventListener("DOMContentLoaded", () => {
    usuario = localStorage.getItem("user");

    if (usuario) {
        setUser(usuario);
        document.getElementById("dashboard-seccion").classList.remove("d-none");
    } else {
        new bootstrap.Modal(document.getElementById("modalBienvenida")).show();
    }
});

function guardarNombre() {
    const val = document.getElementById("inputNombre").value;
    if (!val) return;

    localStorage.setItem("user", val);
    setUser(val);

    bootstrap.Modal.getInstance(document.getElementById("modalBienvenida")).hide();
}

function setUser(name) {
    usuario = name;
    document.getElementById("header-usuario").innerText = name;
    document.getElementById("texto-login").innerText = name;
    document.getElementById("avatar-icon").innerText = name[0].toUpperCase();
    document.getElementById("user-label").innerText = name;
}

function gestionarSesion() {
    localStorage.removeItem("user");
    location.reload();
}

function abrirLibreta() {
    document.getElementById("dashboard-seccion").classList.remove("d-none");
    document.getElementById("dashboard-seccion").scrollIntoView({behavior:"smooth"});
}

/* MESA */
function iniciarMesa(juego) {
    puntos = 0;

    document.getElementById("contenedor-asistente").classList.remove("d-none");
    document.getElementById("mesa-juego").innerText = juego;

    actualizar();
}

function cambiarPuntos(v) {
    puntos += v;
    actualizar();
}

function actualizar() {
    document.querySelectorAll("#display-puntos").forEach(el => el.innerText = puntos);
}

function cerrarMesa() {
    document.getElementById("contenedor-asistente").classList.add("d-none");
}

function sumar(){ puntos++; actualizar(); }
function restar(){ puntos--; actualizar(); }

</script>

</body>
</html>
