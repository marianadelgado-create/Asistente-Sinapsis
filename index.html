<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SINAPSIS | Ecosistema Oficial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --cyan: #00f2fe; --dark: #050505; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; }
        .navbar { border-bottom: 2px solid var(--cyan); background: #000; padding: 1rem 2rem; }
        .card-sinapsis { background: #0f0f0f; border: 1px solid #222; border-radius: 20px; padding: 40px; transition: 0.3s; height: 100%; }
        .card-sinapsis:hover { border-color: var(--cyan); box-shadow: 0 10px 30px rgba(0,242,254,0.1); }
        .btn-cyan { background: var(--cyan); color: #000; font-weight: bold; border-radius: 50px; padding: 12px 30px; }
        .log-area { height: 250px; overflow-y: auto; background: #000; border: 1px solid var(--cyan); padding: 20px; border-radius: 15px; font-family: monospace; color: var(--cyan); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark mb-5">
        <span class="navbar-brand fw-bold fs-4">SINAPSIS <span class="text-muted">| Alma en Foco</span></span>
        <div class="text-cyan fw-bold fs-5" id="user-display">Mariana Delgado</div>
    </nav>

    <main class="container-fluid px-5">
        <!-- Dashboard -->
        <div id="dashboard">
            <h2 class="mb-5">Ecosistema de Juegos</h2>
            <div class="row g-4" id="game-gallery"></div>
        </div>

        <!-- Mesa de Juego -->
        <div id="mesa-view" style="display:none;">
            <button class="btn btn-outline-light mb-4" onclick="Sinapsis.UI.goBack()">← Volver al Dashboard</button>
            <h2 id="mesa-title" class="text-cyan mb-4"></h2>
            <div class="row">
                <div class="col-md-3">
                    <div class="d-grid gap-3">
                        <button class="btn btn-outline-info p-3" onclick="Sinapsis.util.lanzarDado()">🎲 Lanzar Dado</button>
                        <button class="btn btn-outline-info p-3" onclick="Sinapsis.util.iniciarReloj()">⏱️ Reloj Fischer</button>
                    </div>
                </div>
                <div class="col-md-9">
                    <div class="log-area" id="game-log"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const Sinapsis = {
            Games: [
                { name: "Ajedrez", type: "Clásico" },
                { name: "Truco", type: "Clásico" },
                { name: "Lab. Híbrido", type: "Fase 4 (IoT)" }
            ],

            UI: {
                render: () => {
                    const gal = document.getElementById('game-gallery');
                    Sinapsis.Games.forEach(g => {
                        gal.innerHTML += `
                            <div class="col-md-4">
                                <div class="card-sinapsis text-center">
                                    <h3 class="fw-bold mb-2">${g.name}</h3>
                                    <p class="text-muted mb-4">${g.type}</p>
                                    <button class="btn btn-cyan w-100" onclick="Sinapsis.UI.openTable('${g.name}')">Ingresar</button>
                                </div>
                            </div>`;
                    });
                },
                openTable: (name) => {
                    document.getElementById('dashboard').style.display = 'none';
                    document.getElementById('mesa-view').style.display = 'block';
                    document.getElementById('mesa-title').innerText = "Mesa Activa: " + name;
                    Sinapsis.Logger.write("Conexión establecida con " + name);
                },
                goBack: () => {
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('mesa-view').style.display = 'none';
                }
            },

            Logger: {
                write: (msg) => {
                    const log = document.getElementById('game-log');
                    log.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
                    log.scrollTop = log.scrollHeight;
                }
            },

            util: {
                lanzarDado: () => Sinapsis.Logger.write("Resultado: " + (Math.floor(Math.random()*6)+1)),
                iniciarReloj: () => Sinapsis.Logger.write("Reloj Fischer configurado.")
            }
        };

        // Inicialización
        Sinapsis.UI.render();
    </script>
</body>
</html>
