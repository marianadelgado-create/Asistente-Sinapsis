<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sinapsis PRO V2</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:#e8eef6;
}

/* TOPBAR */
.topbar {
  display:flex;
  justify-content:space-between;
  padding:10px 15px;
  background:rgba(0,0,0,0.6);
  position:sticky;
  top:0;
}

button {
  background:#6366f1;
  border:none;
  color:white;
  padding:6px 10px;
  cursor:pointer;
  border-radius:8px;
}

/* LAYOUT */
.section { display:none; padding:15px; }
.active { display:block; }

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card {
  background:rgba(255,255,255,0.05);
  padding:10px;
  border-radius:10px;
}

/* CHAT */
.chatBox {
  height:60vh;
  overflow:auto;
  background:rgba(255,255,255,0.03);
  padding:10px;
  border-radius:10px;
}

.msg {
  margin:8px 0;
  padding:8px;
  border-radius:8px;
}

.user { background:rgba(99,102,241,0.25); }
.bot { background:rgba(255,255,255,0.05); }

/* INPUT */
.inputBar {
  display:flex;
  gap:10px;
  margin-top:10px;
}

input {
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
}

/* GAME */
.gameBox {
  background:rgba(255,255,255,0.05);
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div>🧠 SINAPSIS PRO V2</div>
  <div>
    <button onclick="go('home')">Inicio</button>
    <button onclick="go('chat')">IA</button>
    <button onclick="go('game')">Mesa</button>
    <button onclick="go('notes')">Notas</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="section active">
  <h2>Hub Principal</h2>

  <div class="grid">

    <div class="card">
      <h3>🧠 Asistente IA</h3>
      <p>Sinapsis inteligente</p>
      <button onclick="go('chat')">Entrar</button>
    </div>

    <div class="card">
      <h3>🎮 Mesa de Juego</h3>
      <p>Dados + cartas + turnos</p>
      <button onclick="go('game')">Jugar</button>
    </div>

    <div class="card">
      <h3>📝 Anotador</h3>
      <p>Notas persistentes</p>
      <button onclick="go('notes')">Abrir</button>
    </div>

    <div class="card">
      <h3>💎 Premium</h3>
      <p>Sistema base listo</p>
      <button onclick="alert('Función futura')">Ver</button>
    </div>

  </div>
</div>

<!-- CHAT -->
<div id="chat" class="section">
  <h2>Sinapsis IA</h2>

  <div id="chatBox" class="chatBox"></div>

  <div class="inputBar">
    <input id="inputChat" placeholder="Habla con Sinapsis..." />
    <button onclick="sendChat()">Enviar</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="section">
  <h2>Mesa de Juego Híbrida</h2>

  <div class="gameBox">
    <p>🎲 Dados digitales</p>
    <button onclick="rollDice()">Lanzar dado</button>
    <h3 id="diceResult">-</h3>
  </div>

  <div class="gameBox">
    <p>🃏 Cartas simples</p>
    <button onclick="drawCard()">Robar carta</button>
    <h3 id="cardResult">-</h3>
  </div>

  <div class="gameBox">
    <p>🔄 Turnos</p>
    <button onclick="nextTurn()">Siguiente turno</button>
    <h3 id="turn">Turno: 1</h3>
  </div>
</div>

<!-- NOTES -->
<div id="notes" class="section">
  <h2>Anotador</h2>

  <textarea id="notesBox" style="width:100%;height:200px;"></textarea>
  <button onclick="saveNotes()">Guardar</button>
</div>

<script>
/* ======================
   NAV
====================== */
function go(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ======================
   CHAT IA (SIMULADO LISTO PARA OPENAI)
====================== */

const chatBox = document.getElementById("chatBox");

function addMsg(text,type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chatBox.appendChild(div);
}

async function askAI(msg){
  // 🔥 reemplazar con OpenAI API después
  return "Sinapsis: procesando → " + msg;
}

async function sendChat(){
  const input = document.getElementById("inputChat");
  const text = input.value;
  if(!text) return;

  addMsg(text,"user");
  input.value="";

  const res = await askAI(text);
  addMsg(res,"bot");
}

/* ======================
   MESA DE JUEGO
====================== */

let turn = 1;

function rollDice(){
  const value = Math.floor(Math.random()*6)+1;
  document.getElementById("diceResult").innerText = "🎲 " + value;
}

function drawCard(){
  const cards = ["A","K","Q","J","10","9","8"];
  const card = cards[Math.floor(Math.random()*cards.length)];
  document.getElementById("cardResult").innerText = "🃏 " + card;
}

function nextTurn(){
  turn++;
  document.getElementById("turn").innerText = "Turno: " + turn;
}

/* ======================
   NOTAS
====================== */

function saveNotes(){
  const txt = document.getElementById("notesBox").value;
  localStorage.setItem("notes",txt);
  alert("Guardado");
}

/* load notes */
document.getElementById("notesBox").value = localStorage.getItem("notes")||"";
</script>

</body>
</html>
