<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sinapsis | Ecosistema Alma en Foco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --cyan: #00f2fe; --dark: #050505; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; }
        
        /* Navbar mejorada */
        .navbar { border-bottom: 2px solid var(--cyan); background: #000; padding: 1rem 2rem; }
        
        /* Tarjetas de juego con mejor contraste */
        .card-sinapsis { 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 15px; 
            padding: 30px; 
            transition: 0.4s; 
        }
        .card-sinapsis:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,242,254,0.2); }
        .text-game-type { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        
        /* Botón de acción */
        .btn-cyan { background: var(--cyan); color: #000; font-weight: bold; border: none; }
        
        /* Área de Log */
        .log-area { height: 300px; overflow-y: auto; background: #0a0a0a; border: 1px solid var(--cyan); padding: 20px; border-radius: 10px; font-family: 'Courier New'; color: var(--cyan); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark">
        <span class="navbar-brand fw-bold fs-4">SINAPSIS v1.1 <small class="text-muted">| Alma en Foco</small></span>
        <div class="text-cyan fw-bold fs-5">Mariana Delgado</div>
    </nav>

    <main class="container py-5">
        <!-- Dashboard -->
        <div id="dashboard">
            <h2 class="mb-4 text-white">Ecosistema de Juegos</h2>
            <div class="row g-4" id="game-gallery"></div>
        </div>

        <!-- Mesa de Control (Oculta hasta seleccionar) -->
        <div id="mesa-view" style="display:none;" class="py-4">
            <button class="btn btn-outline-light mb-4" onclick="Sinapsis.UI.goBack()">← Volver al Dashboard</button>
            <h2 id="mesa-title" class="text-cyan mb-4"></h2>
            <div class="row">
                <div class="col-md-3">
                    <div class="d-grid gap-3">
                        <button class="btn btn-outline-info p-3" onclick="Sinapsis.util.lanzarDado()">🎲 Lanzar Dado</button>
                        <button class="btn btn-outline-info p-3" onclick="Sinapsis.util.iniciarReloj()">⏱️ Reloj Fischer</button>
                    </div>
                </div>
                <div class="col-md-9">
                    <div class="log-area" id="game-log"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const Sinapsis = {
            Games: [
                { name: "Ajedrez", type: "Clásico" },
                { name: "Truco", type: "Clásico" },
                { name: "Lab. Híbrido", type: "Fase 4 (IoT)" }
            ],

            UI: {
                render: () => {
                    const gal = document.getElementById('game-gallery');
                    Sinapsis.Games.forEach(g => {
                        gal.innerHTML += `
                            <div class="col-md-4">
                                <div class="card-sinapsis text-center">
                                    <h3 class="text-white">${g.name}</h3>
                                    <p class="text-game-type">${g.type}</p>
                                    <button class="btn btn-cyan w-100 p-2" onclick="Sinapsis.UI.openTable('${g.name}')">Ingresar</button>
                                </div>
                            </div>`;
                    });
                },
                openTable: (name) => {
                    document.getElementById('dashboard').style.display = 'none';
                    document.getElementById('mesa-view').style.display = 'block';
                    document.getElementById('mesa-title').innerText = "Mesa Activa: " + name;
                    Sinapsis.Logger.write("Sistema conectado. Mesa inicializada.");
                },
                goBack: () => {
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('mesa-view').style.display = 'none';
                }
            },

            Logger: {
                write: (msg) => {
                    const log = document.getElementById('game-log');
                    const entry = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
                    log.innerHTML += entry;
                    log.scrollTop = log.scrollHeight;
                }
            },

            util: {
                lanzarDado: () => Sinapsis.Logger.write("Dado lanzado: " + (Math.floor(Math.random()*6)+1)),
                iniciarReloj: () => Sinapsis.Logger.write("Reloj Fischer activado.")
            }
        };

        Sinapsis.UI.render();
    </script>
</body>
</html>
