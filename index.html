<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sinapsis | Ecosistema Alma en Foco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --cyan: #00f2fe; --dark: #050505; }
        body { background: var(--dark); color: #fff; font-family: 'Segoe UI', sans-serif; }
        .card-sinapsis { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; transition: 0.3s; }
        .card-sinapsis:hover { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,242,254,0.3); }
        .log-area { height: 250px; overflow-y: auto; background: #000; border: 1px solid var(--cyan); padding: 15px; border-radius: 10px; font-family: 'Courier New'; color: var(--cyan); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark border-bottom border-info p-3">
        <span class="navbar-brand fw-bold">SINAPSIS v1.1 <span class="text-muted">| Alma en Foco</span></span>
        <div id="user-display" class="text-info fw-bold"></div>
    </nav>

    <main class="container py-4">
        <!-- Dashboard -->
        <div id="dashboard">
            <h3 class="mb-4 text-cyan">Ecosistema de Juegos</h3>
            <div class="row g-4" id="game-gallery"></div>
        </div>

        <!-- Mesa de Control (Modo Híbrido) -->
        <div id="mesa-view" style="display:none;">
            <button class="btn btn-sm btn-secondary mb-3" onclick="Sinapsis.UI.goBack()">← Volver</button>
            <h2 id="mesa-title" class="text-cyan mb-4"></h2>
            <div class="row">
                <div class="col-md-4">
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-info" onclick="Sinapsis.util.lanzarDado()">🎲 Lanzar Dado</button>
                        <button class="btn btn-outline-info" onclick="Sinapsis.util.iniciarReloj()">⏱️ Reloj Fischer</button>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="log-area" id="game-log"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const Sinapsis = {
            // Módulo de Sesión
            User: {
                name: "Mariana Delgado",
                init: () => {
                    document.getElementById('user-display').innerText = Sinapsis.User.name;
                }
            },

            // Módulo de Juegos
            Games: [
                { name: "Ajedrez", type: "Clásico" },
                { name: "Truco", type: "Clásico" },
                { name: "Lab. Híbrido", type: "Fase 4 (IoT)" }
            ],

            // Módulo de Lógica
            UI: {
                render: () => {
                    const gal = document.getElementById('game-gallery');
                    Sinapsis.Games.forEach(g => {
                        gal.innerHTML += `<div class="col-md-4"><div class="card-sinapsis text-center">
                            <h5>${g.name}</h5><p class="text-muted">${g.type}</p>
                            <button class="btn btn-info w-100" onclick="Sinapsis.UI.openTable('${g.name}')">Ingresar</button>
                        </div></div>`;
                    });
                },
                openTable: (name) => {
                    document.getElementById('dashboard').style.display = 'none';
                    document.getElementById('mesa-view').style.display = 'block';
                    document.getElementById('mesa-title').innerText = "Mesa: " + name;
                    Sinapsis.Logger.write(`Acceso a ${name} exitoso.`);
                },
                goBack: () => {
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('mesa-view').style.display = 'none';
                }
            },

            // Módulo de Logger (Persistencia)
            Logger: {
                write: (msg) => {
                    const log = document.getElementById('game-log');
                    const entry = `[${new Date().toLocaleTimeString()}] ${msg}`;
                    log.innerHTML += `<div>${entry}</div>`;
                    // Persistencia: Guardar log en LocalStorage
                    localStorage.setItem('sinapsis_log', log.innerHTML);
                }
            },

            util: {
                lanzarDado: () => Sinapsis.Logger.write("Dado lanzado: " + (Math.floor(Math.random()*6)+1)),
                iniciarReloj: () => Sinapsis.Logger.write("Reloj Fischer activado.")
            }
        };

        // Inicio automático
        Sinapsis.User.init();
        Sinapsis.UI.render();
    </script>
</body>
</html>
